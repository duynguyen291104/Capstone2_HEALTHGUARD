[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fallguard-ai"
version = "0.1.0"
description = "Pose-sequence fall detection, post-fall verification, API, and dashboard."
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "FallGuard Capstone Team" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "mediapipe>=0.10.30,<0.11",
  "numpy>=2.0,<3",
  "opencv-contrib-python>=4.10,<6",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.12,<1",
  "pyyaml>=6.0,<7",
  "requests>=2.32,<3",
  "rich>=13.8,<15",
  "scikit-learn>=1.5,<2",
  "torch>=2.5,<3",
  "tqdm>=4.66,<5",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
fallguard = "fallguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fallguard"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: tests that exercise multiple project components",
  "slow: tests that load models or process real media",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
